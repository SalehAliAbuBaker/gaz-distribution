name: Build permanently signed Android pairing test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gaz-stable-signing
  cancel-in-progress: false
jobs:
  signed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -f "$sdk/platforms/android-34/android.jar"
          test -x "$sdk/build-tools/34.0.0/apksigner"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Test and build unsigned release
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Sign with owner's permanent key
        shell: bash
        env:
          GAZ_KEYSTORE_BASE64: ${{ secrets.GAZ_KEYSTORE_BASE64 }}
          GAZ_KEYSTORE_PASSWORD: ${{ secrets.GAZ_KEYSTORE_PASSWORD }}
          GAZ_SIGNER_SHA256: '8d44eddd980877c21f3c8ecafc456f7ebeafbeb9c1f4e169e9f6d50377df5bb6'
        run: |
          set -euo pipefail
          umask 077
          test -n "$GAZ_KEYSTORE_BASE64" && test -n "$GAZ_KEYSTORE_PASSWORD" && test -n "$GAZ_SIGNER_SHA256" || { echo "Owner signing secrets and expected certificate fingerprint are required."; exit 1; }
          ks="$(mktemp "$RUNNER_TEMP/gaz-key.XXXXXX")"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$GAZ_KEYSTORE_BASE64" | base64 --decode > "$ks"
          bt="$ANDROID_HOME/build-tools/34.0.0"
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          "$bt/zipalign" -c 4 "$apk"
          "$bt/apksigner" sign --ks "$ks" --ks-type PKCS12 --ks-key-alias gaz --ks-pass env:GAZ_KEYSTORE_PASSWORD --key-pass env:GAZ_KEYSTORE_PASSWORD --out Rafd-0.2.21-pairing-test.apk "$apk"
          "$bt/apksigner" verify --print-certs Rafd-0.2.21-pairing-test.apk > cert.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' cert.txt | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$GAZ_SIGNER_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "${#actual}" = 64 && test "$actual" = "$expected" || { echo "Signer differs from pinned fingerprint"; exit 1; }
          "$bt/aapt" dump badging Rafd-0.2.21-pairing-test.apk > badging.txt
          grep -F "package: name='ye.gaz.distribution'" badging.txt
          grep -F "versionName='0.2.21'" badging.txt
          if grep -q 'application-debuggable' badging.txt; then echo "Release APK must not be debuggable"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Rafd-0.2.21-pairing-test-signed
          path: Rafd-0.2.21-pairing-test.apk
          if-no-files-found: error
  publish:
    needs: signed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Rafd-0.2.21-pairing-test-signed
      - name: Publish signed pairing test
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.21-pairing-test >/dev/null 2>&1; then echo "Existing signed release is immutable"; exit 1; fi
          gh release create v0.2.21-pairing-test Rafd-0.2.21-pairing-test.apk --target "$GITHUB_SHA" --prerelease --title "Rafd 0.2.21 — signed pairing test" --notes "إصدار تجريبي لهوية رفد الجديدة؛ وحدة الغاز الحالية محفوظة. تحديث فوق النسخة السابقة دون حذفها. اختبار ميداني مطلوب."
