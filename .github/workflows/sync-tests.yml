name: Test multi-device authority
on:
  push:
    branches: [main]
    paths: ['sync/**', '.github/workflows/sync-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test sync/authority.test.mjs
