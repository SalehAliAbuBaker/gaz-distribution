name: Build Android test APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      same_signer: ${{ steps.signer.outputs.same_signer }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -z "$sdk" ]; then echo "Android SDK not found"; exit 1; fi
          if [ ! -f "$sdk/platforms/android-34/android.jar" ] || [ ! -d "$sdk/build-tools/34.0.0" ]; then
            manager="$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
            if [ -z "$manager" ]; then echo "sdkmanager not found under $sdk"; exit 1; fi
            export ANDROID_HOME="$sdk" ANDROID_SDK_ROOT="$sdk"
            "$manager" --sdk_root="$sdk" --install "platforms;android-34" "build-tools;34.0.0"
          fi
          test -f "$sdk/platforms/android-34/android.jar"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and compare previous test signature
        id: signer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          aapt="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > apk-badging.txt
          grep -F "versionName='0.2.1'" apk-badging.txt
          grep -E 'application-icon|icon=' apk-badging.txt
          gh release download v0.2.0-test --pattern Gaz-Distribution-0.2.0-test.apk --dir previous-apk
          old=$("$apksigner" verify --print-certs previous-apk/Gaz-Distribution-0.2.0-test.apk | grep 'certificate SHA-256 digest:' | sort)
          new=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'certificate SHA-256 digest:' | sort)
          if [ -n "$old" ] && [ "$old" = "$new" ]; then
            echo "same_signer=true" >> "$GITHUB_OUTPUT"
          else
            echo "same_signer=false" >> "$GITHUB_OUTPUT"
            echo "Previous test signature differs; do not uninstall before preserving data."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Gaz-Distribution-0.2.1-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-test:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SAME_SIGNER: ${{ needs.apk.outputs.same_signer }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Gaz-Distribution-0.2.1-test
          path: apk
      - name: Publish immutable test release
        shell: bash
        run: |
          set -euo pipefail
          cp apk/app-debug.apk Gaz-Distribution-0.2.1-test.apk
          tag=v0.2.1-test
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Test release already exists; not overwriting."
            exit 0
          fi
          printf '%s\n' 'أيقونة التطبيق المعتمدة: أسطوانة الغاز والشعلة والهلال البرتقالي، بدون كتابة.' 'نسخة تجريبية لجهاز واحد، لا مزامنة بعد.' "Same signer as 0.2.0: $SAME_SIGNER" 'إذا اختلف التوقيع، لا تحذف الإصدار السابق قبل حفظ بياناتك والتحقق من قابلية الاستعادة. لا تستخدم بيانات حقيقية.' > notes.txt
          gh release create "$tag" Gaz-Distribution-0.2.1-test.apk --target "$GITHUB_SHA" --title "Gaz Distribution 0.2.1 — Android test" --notes-file notes.txt --prerelease
