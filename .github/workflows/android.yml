name: Build Android test APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      same_signer: ${{ steps.signer.outputs.same_signer }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -z "$sdk" ]; then echo "Android SDK not found"; exit 1; fi
          if [ ! -f "$sdk/platforms/android-34/android.jar" ] || [ ! -d "$sdk/build-tools/34.0.0" ]; then
            manager="$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
            if [ -z "$manager" ]; then echo "sdkmanager not found under $sdk"; exit 1; fi
            export ANDROID_HOME="$sdk" ANDROID_SDK_ROOT="$sdk"
            "$manager" --sdk_root="$sdk" --install "platforms;android-34" "build-tools;34.0.0"
          fi
          test -f "$sdk/platforms/android-34/android.jar"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Verify UI scripts and large-registry navigation
        run: |
          node scripts/test-ui-performance.cjs
          node scripts/test-stock.cjs
          node scripts/test-focus.cjs
      - name: Build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :issuer:assembleRelease
      - name: Verify APK and compare previous test signature
        id: signer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          aapt="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > apk-badging.txt
          grep -F "versionName='1.0.16'" apk-badging.txt
          grep -E 'application-icon|icon=' apk-badging.txt
          gh release download v0.2.1-test --pattern Gaz-Distribution-0.2.1-test.apk --dir previous-apk
          old=$("$apksigner" verify --print-certs previous-apk/Gaz-Distribution-0.2.1-test.apk | grep 'certificate SHA-256 digest:' | sort)
          new=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'certificate SHA-256 digest:' | sort)
          if [ -n "$old" ] && [ "$old" = "$new" ]; then
            echo "same_signer=true" >> "$GITHUB_OUTPUT"
          else
            echo "same_signer=false" >> "$GITHUB_OUTPUT"
            echo "Previous test signature differs; do not uninstall before preserving data."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Rafd-1.0.16-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare owner offline signing package
        shell: bash
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p signing-input
          "$bt/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk signing-input/gaz-unsigned-aligned.apk
          "$bt/zipalign" -c 4 signing-input/gaz-unsigned-aligned.apk
          cp "$bt/lib/apksigner.jar" signing-input/apksigner.jar
          (cd signing-input && sha256sum gaz-unsigned-aligned.apk apksigner.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Rafd-1.0.16-offline-signing-input
          path: signing-input/
          if-no-files-found: error
      - name: Prepare issuer offline signing package
        shell: bash
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p issuer-signing-input
          "$bt/zipalign" -f -p 4 issuer/build/outputs/apk/release/issuer-release-unsigned.apk issuer-signing-input/rafd-issuer-unsigned-aligned.apk
          "$bt/zipalign" -c 4 issuer-signing-input/rafd-issuer-unsigned-aligned.apk
          cp "$bt/lib/apksigner.jar" issuer-signing-input/apksigner.jar
          (cd issuer-signing-input && sha256sum rafd-issuer-unsigned-aligned.apk apksigner.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Rafd-License-Issuer-1.0.3-offline-signing-input
          path: issuer-signing-input/
          if-no-files-found: error
