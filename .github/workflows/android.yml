name: Build Android test APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ]; then echo "Android SDK not found"; exit 1; fi
          if [ ! -f "$sdk/platforms/android-34/android.jar" ] || [ ! -d "$sdk/build-tools/34.0.0" ]; then
            sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          fi
          test -f "$sdk/platforms/android-34/android.jar"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gaz-Distribution-0.2.0-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
